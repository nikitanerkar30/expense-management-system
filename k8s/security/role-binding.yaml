apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: expense-app-role-binding
  namespace: expense-dev

subjects:
  - kind : ServiceAccount
    name: expense-app-sa
    namespace: expense-dev

roleRef:
  kind: Role
  name: expense-app-role
  apiGroup: rbac.authorization.k8s.io
