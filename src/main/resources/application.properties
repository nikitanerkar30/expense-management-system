# ===============================
# Application
# ===============================
spring.application.name=expense-management-system

# ===============================
# MySQL Database Configuration
# ===============================
#spring.datasource.url=jdbc:mysql://localhost:3306/expense_db
spring.datasource.url=jdbc:mysql://expense-mysql:3306/expense_db?useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://expense-mysql:3306/expense_db
spring.datasource.username=expense_app
spring.datasource.password=Expense@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# Server
# ===============================
server.port=8086